<!doctype html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>♡</title>

    <link rel="icon" type="image/png" href="Foto/icon.png">


    <!-- FUENTES -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         PANTALLA DEL SOBRE
    ========================================== -->

    <div id="envelope-container">


        <img
            src="Sobre.png"
            alt="Sobre"
            id="envelope"
        >


        <p class="envelope-text">

            ♡ Veo que pudiste adivinar quienes somos esta vez,

            <br>

            espero que te guste ♡

        </p>


    </div>



    <!-- =========================================
         PANTALLA PRINCIPAL
    ========================================== -->

    <div id="letter-container">


        <!--
            Ya NO existe Ventana.png.

            Este contenedor solamente sirve
            para organizar el contenido.
        -->

        <div class="letter-window">


            <!-- =========================
                 CUADRO DEL TÍTULO
            ========================== -->

            <div class="question-box">

                <h1 id="letter-title">

                    ¿Lista para seguir?

                </h1>

            </div>



            <!-- =========================
                 GIF
            ========================== -->

            <img
                src="LMG.gif"
                class="cat"
                id="letter-cat"
                alt="Gif"
            >



            <!-- =========================
                 BOTONES YES / NO
            ========================== -->

            <div
                class="buttons"
                id="letter-buttons"
            >


                <!-- YES -->

                <img
                    src="yes.png"
                    class="btn yes-btn"
                    alt="Yes"
                >


                <!-- NO -->

                <div class="no-wrapper">

                    <img
                        src="no.png"
                        class="btn no-btn"
                        alt="No"
                    >

                </div>


            </div>



            <!-- =================================
                 CONTENIDO DESPUÉS DE YES
            ================================== -->

            <div
                id="final-content"
                class="final-content"
            >


                <p class="final-text">

                    <strong>
                        Sabías que si querías, ¿por qué no vienes? 
                    </strong>

                </p>


<a
    href="../Carta/index.html"
    class="final-button"
>
    justo aquí ♡
</a>


            </div>


        </div>


    </div>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
